<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 340" font-family="Inter,-apple-system,sans-serif">
  <style>
    .surface{fill:#FAFAF8}.tp{fill:#0A0A0A}.ts{fill:#737373}
    .s25{fill:#002FA7;fill-opacity:.25}.s45{fill:#002FA7;fill-opacity:.45}
    .s70{fill:#002FA7;fill-opacity:.70}.s100{fill:#002FA7}
    .edge{stroke:#737373;stroke-width:1.5;fill:none}
    .arw{fill:#737373}
    @media (prefers-color-scheme: dark){
      .surface{fill:#0A0A0A}.tp{fill:#FAFAF8}.ts{fill:#A8A8A6}
      .s25{fill:#7A96E8;fill-opacity:.30}.s45{fill:#7A96E8;fill-opacity:.50}
      .s70{fill:#7A96E8;fill-opacity:.72}.s100{fill:#7A96E8}
      .edge{stroke:#A8A8A6}.arw{fill:#A8A8A6}
    }
  </style>
  <defs>
    <marker id="e1" markerWidth="8" markerHeight="8" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" class="arw"/></marker>
  </defs>
  <rect class="surface" x="0" y="0" width="780" height="340"/>
  <text class="tp" x="24" y="40" font-size="17" font-weight="600">Evidence Ladder, a climb rather than a switch</text>

  <text class="tp" x="109" y="214" font-size="14" font-weight="600" text-anchor="middle">1 Replay</text>
  <text class="ts" x="109" y="233" font-size="14" text-anchor="middle">zero consequences</text>
  <rect class="s25" x="24" y="240" width="170" height="60" rx="4"/>

  <text class="tp" x="303" y="174" font-size="14" font-weight="600" text-anchor="middle">2 silent / shadow</text>
  <text class="ts" x="303" y="193" font-size="14" text-anchor="middle">online, inert</text>
  <rect class="s45" x="218" y="200" width="170" height="100" rx="4"/>

  <text class="tp" x="497" y="134" font-size="14" font-weight="600" text-anchor="middle">3 Canary</text>
  <text class="ts" x="497" y="153" font-size="14" text-anchor="middle">real, small scale</text>
  <rect class="s70" x="412" y="160" width="170" height="140" rx="4"/>

  <text class="tp" x="681" y="94" font-size="14" font-weight="600" text-anchor="middle">4 Full traffic</text>
  <text class="ts" x="681" y="113" font-size="14" text-anchor="middle">only scale</text>
  <rect class="s100" x="606" y="120" width="150" height="180" rx="4"/>

  <g class="edge">
    <path d="M40 320 H 716" marker-end="url(#e1)"/>
  </g>
  <text class="ts" x="378" y="336" font-size="14" text-anchor="middle">consequence scale and evidence strength</text>
</svg>
