<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 372" font-family="Inter,-apple-system,sans-serif">
  <style>
    .surface{fill:#FAFAF8}.tp{fill:#0A0A0A}.ts{fill:#737373}
    .core{fill:#002FA7;fill-opacity:.09;stroke:#002FA7;stroke-width:1.5}
    .swap{fill:#FAFAF8;stroke:#737373;stroke-width:1.5;stroke-dasharray:5 4}
    .io{fill:#FAFAF8;stroke:#B8B8B4;stroke-width:1.5}
    .edge{stroke:#737373;stroke-width:1.5;fill:none}
    .arw{fill:#737373}
    .accent{fill:#002FA7}
    @media (prefers-color-scheme: dark){
      .surface{fill:#0A0A0A}.tp{fill:#FAFAF8}.ts{fill:#A8A8A6}
      .core{fill:#7A96E8;fill-opacity:.16;stroke:#7A96E8}
      .swap{fill:#0A0A0A;stroke:#A8A8A6}
      .io{fill:#0A0A0A;stroke:#5A5A58}
      .edge{stroke:#A8A8A6}
      .arw{fill:#A8A8A6}
      .accent{fill:#7A96E8}
    }
  </style>
  <defs>
    <marker id="ah" markerWidth="8" markerHeight="8" refX="6.5" refY="3.5" orient="auto">
      <path d="M0 0 L7 3.5 L0 7 Z" class="arw"/>
    </marker>
  </defs>
  <rect class="surface" x="0" y="0" width="780" height="372"/>

  <text class="tp" x="24" y="36" font-size="17" font-weight="600">The harness: six components, one data flow</text>
  <text class="ts" x="24" y="58" font-size="13">Six core components in blue; two swappable parts, world and synth</text>

  <!-- legend -->
  <rect class="core" x="512" y="25" width="16" height="16" rx="3"/>
  <text class="tp" x="534" y="38" font-size="13">core component</text>
  <rect class="swap" x="648" y="25" width="16" height="16" rx="3"/>
  <text class="tp" x="670" y="38" font-size="13">swappable</text>

  <!-- main spine -->
  <rect class="io" x="20" y="120" width="100" height="42" rx="6"/>
  <text class="tp" x="70" y="146" font-size="13" text-anchor="middle">case (YAML)</text>

  <rect class="core" x="150" y="120" width="92" height="42" rx="6"/>
  <text class="tp" x="196" y="146" font-size="14" font-weight="600" text-anchor="middle">runner</text>

  <rect class="core" x="272" y="120" width="120" height="42" rx="6"/>
  <text class="tp" x="332" y="146" font-size="13" font-weight="600" text-anchor="middle">trace (JSONL)</text>

  <rect class="core" x="440" y="92" width="124" height="42" rx="6"/>
  <text class="tp" x="502" y="118" font-size="14" font-weight="600" text-anchor="middle">assertions</text>

  <rect class="core" x="440" y="150" width="124" height="42" rx="6"/>
  <text class="tp" x="502" y="176" font-size="14" font-weight="600" text-anchor="middle">judge</text>

  <rect class="core" x="600" y="120" width="78" height="42" rx="6"/>
  <text class="tp" x="639" y="146" font-size="14" font-weight="600" text-anchor="middle">stats</text>

  <rect class="core" x="698" y="120" width="74" height="42" rx="6"/>
  <text class="tp" x="735" y="146" font-size="14" font-weight="600" text-anchor="middle">report</text>

  <!-- spine arrows -->
  <line class="edge" x1="120" y1="141" x2="146" y2="141" marker-end="url(#ah)"/>
  <line class="edge" x1="242" y1="141" x2="268" y2="141" marker-end="url(#ah)"/>

  <!-- trace -> branch to assertions & judge -->
  <path class="edge" d="M392 141 H416"/>
  <path class="edge" d="M416 113 V169"/>
  <line class="edge" x1="416" y1="113" x2="436" y2="113" marker-end="url(#ah)"/>
  <line class="edge" x1="416" y1="171" x2="436" y2="171" marker-end="url(#ah)"/>

  <!-- assertions & judge -> merge -> stats -->
  <path class="edge" d="M564 113 H584"/>
  <path class="edge" d="M564 171 H584"/>
  <path class="edge" d="M584 113 V169"/>
  <line class="edge" x1="584" y1="141" x2="596" y2="141" marker-end="url(#ah)"/>

  <!-- stats -> report -->
  <line class="edge" x1="678" y1="141" x2="694" y2="141" marker-end="url(#ah)"/>

  <!-- swappable parts hang under runner -->
  <rect class="swap" x="252" y="250" width="196" height="40" rx="6"/>
  <text class="tp" x="350" y="275" font-size="13" text-anchor="middle">world (sandbox + stubs)</text>

  <rect class="swap" x="252" y="302" width="196" height="40" rx="6"/>
  <text class="tp" x="350" y="327" font-size="13" text-anchor="middle">synth (synthetic users)</text>

  <path class="edge" d="M196 162 V322"/>
  <line class="edge" x1="196" y1="270" x2="248" y2="270" marker-end="url(#ah)"/>
  <line class="edge" x1="196" y1="322" x2="248" y2="322" marker-end="url(#ah)"/>
  <text class="ts" x="206" y="230" font-size="13">the two parts that hold all world knowledge</text>
</svg>
