<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 524" font-family="Inter,-apple-system,sans-serif">
  <style>
    .surface{fill:#FAFAF8}.tp{fill:#0A0A0A}.ts{fill:#737373}
    .band{fill:#FFFFFF;fill-opacity:.55;stroke:#B8B8B4;stroke-width:1.5}
    .find{fill:#002FA7;fill-opacity:.09;stroke:#002FA7;stroke-width:1.5}
    .empty{fill:none;stroke:#B8B8B4;stroke-width:1.5;stroke-dasharray:5 4}
    .pocket{fill:#F0F0EC;stroke:#B8B8B4;stroke-width:1.5}
    .flow{fill:#002FA7;fill-opacity:.22}
    .link{stroke:#737373;stroke-width:1.5;fill:none}
    .arrow{fill:#737373}
    .breach{fill:#B23A48;fill-opacity:.09;stroke:#B23A48;stroke-width:1.5}
    .drop{fill:#B23A48}
    .accent{fill:#002FA7}
    @media (prefers-color-scheme: dark){
      .surface{fill:#0A0A0A}.tp{fill:#FAFAF8}.ts{fill:#A8A8A6}
      .band{fill:#FFFFFF;fill-opacity:.04;stroke:#5A5A58}
      .find{fill:#7A96E8;fill-opacity:.16;stroke:#7A96E8}
      .empty{stroke:#5A5A58}
      .pocket{fill:#1A1A1A;stroke:#5A5A58}
      .flow{fill:#7A96E8;fill-opacity:.3}
      .link{stroke:#A8A8A6}
      .arrow{fill:#A8A8A6}
      .breach{fill:#E88A94;fill-opacity:.14;stroke:#E88A94}
      .drop{fill:#E88A94}
      .accent{fill:#7A96E8}
    }
  </style>
  <rect class="surface" x="0" y="0" width="780" height="524"/>

  <text class="tp" x="24" y="34" font-size="17" font-weight="600">Defense in depth, verified layer by layer</text>
  <text class="ts" x="24" y="56" font-size="13">15 attack samples, one run. What each layer stopped and what leaked past it.</text>

  <!-- Entry -->
  <rect class="find" x="210" y="76" width="320" height="36" rx="18"/>
  <text class="accent" x="370" y="99" font-size="15" font-weight="600" text-anchor="middle">15 attack samples come in</text>

  <!-- Flow: width scales with count (2px per sample) -->
  <rect class="flow" x="355" y="112" width="30" height="20"/>
  <text class="ts" x="396" y="127" font-size="13">15</text>

  <!-- Layer 1 -->
  <rect class="empty" x="210" y="132" width="320" height="48" rx="8"/>
  <text class="ts" x="226" y="152" font-size="15" font-weight="600">1 Input filtering / content isolation</text>
  <text class="ts" x="226" y="171" font-size="13">Mini has no such layer</text>
  <line class="link" x1="530" y1="156" x2="566" y2="156"/>
  <polygon class="arrow" points="566,151 576,156 566,161"/>
  <rect class="empty" x="580" y="132" width="180" height="48" rx="8"/>
  <text class="ts" x="670" y="152" font-size="15" font-weight="600" text-anchor="middle">stopped 0</text>
  <text class="ts" x="670" y="171" font-size="13" text-anchor="middle">never triggered, or useless?</text>

  <rect class="flow" x="355" y="180" width="30" height="20"/>
  <text class="ts" x="396" y="195" font-size="13">15 leak to the next layer</text>

  <!-- Layer 2 -->
  <rect class="band" x="210" y="200" width="320" height="48" rx="8"/>
  <text class="tp" x="226" y="220" font-size="15" font-weight="600">2 Action boundary</text>
  <text class="ts" x="226" y="239" font-size="13">the spec's "what it does not do" (Chapter 2)</text>
  <line class="link" x1="530" y1="224" x2="566" y2="224"/>
  <polygon class="arrow" points="566,219 576,224 566,229"/>
  <rect class="pocket" x="580" y="200" width="180" height="48" rx="8"/>
  <text class="tp" x="670" y="229" font-size="15" font-weight="600" text-anchor="middle">stopped 3</text>

  <rect class="flow" x="358" y="248" width="24" height="20"/>
  <text class="ts" x="396" y="263" font-size="13">12 leak to the next layer</text>

  <!-- Layer 3 -->
  <rect class="band" x="210" y="268" width="320" height="48" rx="8"/>
  <text class="tp" x="226" y="288" font-size="15" font-weight="600">3 Permission matrix</text>
  <text class="ts" x="226" y="307" font-size="13">hard boundary, not judgment (Chapter 8)</text>
  <line class="link" x1="530" y1="292" x2="566" y2="292"/>
  <polygon class="arrow" points="566,287 576,292 566,297"/>
  <rect class="pocket" x="580" y="268" width="180" height="48" rx="8"/>
  <text class="tp" x="670" y="297" font-size="15" font-weight="600" text-anchor="middle">stopped 7</text>

  <rect class="flow" x="365" y="316" width="10" height="20"/>
  <text class="ts" x="396" y="331" font-size="13">5 leak to the next layer</text>

  <!-- Layer 4 -->
  <rect class="band" x="210" y="336" width="320" height="48" rx="8"/>
  <text class="tp" x="226" y="356" font-size="15" font-weight="600">4 Human confirmation</text>
  <text class="ts" x="226" y="375" font-size="13">human in the loop before the action lands</text>
  <line class="link" x1="530" y1="360" x2="566" y2="360"/>
  <polygon class="arrow" points="566,355 576,360 566,365"/>
  <rect class="pocket" x="580" y="336" width="180" height="48" rx="8"/>
  <text class="tp" x="670" y="365" font-size="15" font-weight="600" text-anchor="middle">stopped 2</text>

  <rect class="flow" x="367" y="384" width="6" height="20"/>
  <text class="ts" x="396" y="399" font-size="13">3 past every layer</text>

  <!-- Breach -->
  <rect class="breach" x="210" y="404" width="320" height="48" rx="8"/>
  <text class="drop" x="226" y="424" font-size="15" font-weight="600">Breach 3, red-line action happened</text>
  <text class="ts" x="226" y="443" font-size="13">counted on its own line, never averaged</text>

  <text class="ts" x="20" y="486" font-size="13"><tspan class="accent" font-weight="600">Read the shape</tspan>. Layer 1 is decoration, the middle two carry the load, some got through.</text>
  <text class="ts" x="20" y="506" font-size="13">The integers are one draw; the intervals belong in Table 12-2's last column.</text>
</svg>
