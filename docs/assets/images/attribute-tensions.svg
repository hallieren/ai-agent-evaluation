<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 350" font-family="Inter,-apple-system,'Helvetica Neue',Arial,sans-serif">
  <style>
    .surface{fill:#FAFAF8}.tp{fill:#0A0A0A}.ts{fill:#737373}
    .c{fill:#002FA7}.a{fill:#002FA7;fill-opacity:.16}.n{fill:#F0F0EE;stroke:#D4D4D2}
    .onfill{fill:#FAFAF8}
    @media (prefers-color-scheme: dark){
      .surface{fill:#0A0A0A}.tp{fill:#FAFAF8}.ts{fill:#A8A8A6}
      .c{fill:#7A96E8}.a{fill:#7A96E8;fill-opacity:.22}.n{fill:#1C1C1A;stroke:#4A4A48}
      .onfill{fill:#0A0A0A}
    }
  </style>
  <rect class="surface" x="0" y="0" width="840" height="350"/>
  <text class="tp" x="24" y="38" font-size="17" font-weight="600">Six attributes, pair by pair: conflict is the norm, alignment the exception</text>

  <g transform="translate(0,-28)">
    <!-- Column labels -->
    <text class="ts" x="208" y="100" font-size="13" text-anchor="middle">Correctness</text>
    <text class="ts" x="316" y="100" font-size="13" text-anchor="middle">Process soundness</text>
    <text class="ts" x="424" y="100" font-size="13" text-anchor="middle">Safety</text>
    <text class="ts" x="532" y="100" font-size="13" text-anchor="middle">Cost</text>
    <text class="ts" x="640" y="100" font-size="13" text-anchor="middle">Latency</text>

    <!-- Row: Process soundness -->
    <text class="ts" x="150" y="138" font-size="13" text-anchor="end">Process soundness</text>
    <rect class="c" x="157" y="110" width="102" height="44" rx="4"/><text class="onfill" x="208" y="137" font-size="13" text-anchor="middle">conflict</text>

    <!-- Row: Safety -->
    <text class="ts" x="150" y="188" font-size="13" text-anchor="end">Safety</text>
    <rect class="c" x="157" y="160" width="102" height="44" rx="4"/><text class="onfill" x="208" y="187" font-size="13" text-anchor="middle">conflict</text>
    <rect class="a" x="265" y="160" width="102" height="44" rx="4"/><text class="tp" x="316" y="187" font-size="13" text-anchor="middle">mostly aligned</text>

    <!-- Row: Cost -->
    <text class="ts" x="150" y="238" font-size="13" text-anchor="end">Cost</text>
    <rect class="c" x="157" y="210" width="102" height="44" rx="4"/><text class="onfill" x="208" y="237" font-size="13" text-anchor="middle">conflict</text>
    <rect class="c" x="265" y="210" width="102" height="44" rx="4"/><text class="onfill" x="316" y="237" font-size="13" text-anchor="middle">conflict</text>
    <rect class="c" x="373" y="210" width="102" height="44" rx="4"/><text class="onfill" x="424" y="237" font-size="13" text-anchor="middle">conflict</text>

    <!-- Row: Latency -->
    <text class="ts" x="150" y="288" font-size="13" text-anchor="end">Latency</text>
    <rect class="c" x="157" y="260" width="102" height="44" rx="4"/><text class="onfill" x="208" y="287" font-size="13" text-anchor="middle">conflict</text>
    <rect class="c" x="265" y="260" width="102" height="44" rx="4"/><text class="onfill" x="316" y="287" font-size="13" text-anchor="middle">conflict (weak)</text>
    <rect class="c" x="373" y="260" width="102" height="44" rx="4"/><text class="onfill" x="424" y="287" font-size="13" text-anchor="middle">conflict</text>
    <rect class="a" x="481" y="260" width="102" height="44" rx="4"/><text class="tp" x="532" y="287" font-size="13" text-anchor="middle">mostly aligned</text>

    <!-- Row: Reproducibility -->
    <text class="ts" x="150" y="338" font-size="13" text-anchor="end">Reproducibility</text>
    <rect class="c" x="157" y="310" width="102" height="44" rx="4"/><text class="onfill" x="208" y="337" font-size="13" text-anchor="middle">conflict</text>
    <rect class="a" x="265" y="310" width="102" height="44" rx="4"/><text class="tp" x="316" y="337" font-size="13" text-anchor="middle">mostly aligned</text>
    <rect class="a" x="373" y="310" width="102" height="44" rx="4"/><text class="tp" x="424" y="337" font-size="13" text-anchor="middle">mostly aligned</text>
    <rect class="c" x="481" y="310" width="102" height="44" rx="4"/><text class="onfill" x="532" y="337" font-size="13" text-anchor="middle">conflict</text>
    <rect class="n" x="589" y="310" width="102" height="44" rx="4"/><text class="ts" x="640" y="337" font-size="13" text-anchor="middle">unrelated</text>
  </g>
</svg>
