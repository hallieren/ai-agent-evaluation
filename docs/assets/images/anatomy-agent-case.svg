<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 235" font-family="Inter,-apple-system,'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif">
  <style>
    .surface{fill:#FAFAF8}
    .tp{fill:#0A0A0A}.ts{fill:#737373}.acc{fill:#002FA7}
    .box{fill:#FAFAF8;stroke:#D4D4D2;stroke-width:2}
    .accbox{fill:#002FA7;fill-opacity:.10;stroke:#002FA7;stroke-width:2}
    .div{stroke:#D4D4D2;stroke-width:1.5;stroke-dasharray:4 5}
    .arrow{stroke:#737373;stroke-width:2;fill:none}.aarrow{stroke:#002FA7;stroke-width:2;fill:none}
    .ah{fill:#737373}.aah{fill:#002FA7}
    @media (prefers-color-scheme: dark){
      .surface{fill:#0A0A0A}.tp{fill:#FAFAF8}.ts{fill:#A8A8A6}.acc{fill:#7A96E8}
      .box{fill:#0A0A0A;stroke:#3A3A3A}
      .accbox{fill:#7A96E8;fill-opacity:.16;stroke:#7A96E8}
      .div{stroke:#3A3A3A}
      .arrow{stroke:#A8A8A6}.aarrow{stroke:#7A96E8}
      .ah{fill:#A8A8A6}.aah{fill:#7A96E8}
    }
  </style>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" class="ah"/></marker>
    <marker id="aah" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" class="aah"/></marker>
  </defs>
  <rect class="surface" x="0" y="0" width="840" height="235"/>
  <text class="tp" x="24" y="34" font-size="17" font-weight="600">Anatomy of an agent case</text>

  <!-- LEFT: single-turn -->
  <text class="ts" x="188" y="76" font-size="13" text-anchor="middle">Single-turn LLM app</text>
  <rect class="box" x="88" y="92" width="96" height="42" rx="8"/>
  <text class="tp" x="136" y="118" font-size="14" text-anchor="middle">input</text>
  <line class="arrow" x1="188" y1="113" x2="212" y2="113" marker-end="url(#ah)"/>
  <rect class="box" x="216" y="92" width="112" height="42" rx="8"/>
  <text class="tp" x="272" y="118" font-size="14" text-anchor="middle">gold answer</text>
  <text class="acc" x="200" y="210" font-size="15" font-weight="600" text-anchor="middle">2 parts</text>

  <!-- divider -->
  <line class="div" x1="380" y1="66" x2="380" y2="196"/>

  <!-- RIGHT: agent -->
  <text class="ts" x="608" y="76" font-size="13" text-anchor="middle">Agent</text>
  <rect class="accbox" x="412" y="90" width="128" height="40" rx="8"/>
  <text class="acc" x="476" y="115" font-size="14" font-weight="600" text-anchor="middle">world state</text>
  <rect class="box" x="412" y="140" width="128" height="40" rx="8"/>
  <text class="tp" x="476" y="165" font-size="14" text-anchor="middle">request</text>
  <path class="aarrow" d="M540 110 L572 110 L572 135"/>
  <path class="aarrow" d="M540 160 L572 160 L572 135"/>
  <line class="aarrow" x1="572" y1="135" x2="606" y2="135" marker-end="url(#aah)"/>
  <rect class="accbox" x="610" y="98" width="214" height="78" rx="8"/>
  <text class="acc" x="717" y="123" font-size="13" font-weight="600" text-anchor="middle">trajectory properties</text>
  <text class="tp" x="717" y="146" font-size="13" text-anchor="middle">assertions · end-state</text>
  <text class="ts" x="717" y="167" font-size="13" text-anchor="middle">judge · optional</text>
  <text class="acc" x="608" y="210" font-size="15" font-weight="600" text-anchor="middle">3 parts</text>
</svg>
