<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 276" font-family="Inter,-apple-system,sans-serif">
  <style>
    .surface{fill:#FAFAF8}.tp{fill:#0A0A0A}.ts{fill:#737373}
    .band{fill:#FFFFFF;fill-opacity:.55;stroke:#B8B8B4;stroke-width:1.5}
    .find{fill:#002FA7;fill-opacity:.09;stroke:#002FA7;stroke-width:1.5}
    .edge{stroke:#737373;stroke-width:1.5;fill:none}
    .arw{fill:#737373}
    .back{stroke:#002FA7;stroke-width:1.5;fill:none;stroke-dasharray:6 4}
    .backarw{fill:#002FA7}
    .accent{fill:#002FA7}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
    @media (prefers-color-scheme: dark){
      .surface{fill:#0A0A0A}.tp{fill:#FAFAF8}.ts{fill:#A8A8A6}
      .band{fill:#FFFFFF;fill-opacity:.04;stroke:#5A5A58}
      .find{fill:#7A96E8;fill-opacity:.16;stroke:#7A96E8}
      .edge{stroke:#A8A8A6}.arw{fill:#A8A8A6}
      .back{stroke:#7A96E8}.backarw{fill:#7A96E8}
      .accent{fill:#7A96E8}
    }
  </style>
  <defs>
    <marker id="ah" markerWidth="8" markerHeight="8" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" class="arw"/></marker>
    <marker id="ab" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" class="backarw"/></marker>
  </defs>
  <rect class="surface" x="0" y="0" width="780" height="276"/>

  <text class="tp" x="24" y="34" font-size="17" font-weight="600">The step-40 failure roots at step 6, three days back</text>
  <text class="ts" x="24" y="56" font-size="13">Contamination compounds forward; attribution traces the write chain back</text>

  <!-- nodes -->
  <rect class="find" x="24" y="86" width="150" height="60" rx="8"/>
  <text class="accent" x="99" y="112" font-size="14" font-weight="600" text-anchor="middle">Day 1  ★</text>
  <text class="ts" x="99" y="132" font-size="13" text-anchor="middle">writes the note</text>

  <rect class="band" x="216" y="86" width="150" height="60" rx="8"/>
  <text class="tp" x="291" y="112" font-size="14" font-weight="600" text-anchor="middle">Day 2</text>
  <text class="ts" x="291" y="132" font-size="13" text-anchor="middle">reads, writes on top</text>

  <rect class="band" x="408" y="86" width="150" height="60" rx="8"/>
  <text class="tp" x="483" y="112" font-size="14" font-weight="600" text-anchor="middle">Day 3</text>
  <text class="ts" x="483" y="132" font-size="13" text-anchor="middle">reads, writes on top</text>

  <rect class="band" x="600" y="86" width="150" height="60" rx="8"/>
  <text class="tp" x="675" y="112" font-size="14" font-weight="600" text-anchor="middle">Report</text>
  <text class="ts" x="675" y="132" font-size="13" text-anchor="middle">conclusion wrong</text>

  <!-- forward arrows -->
  <line class="edge" x1="174" y1="116" x2="214" y2="116" marker-end="url(#ah)"/>
  <line class="edge" x1="366" y1="116" x2="406" y2="116" marker-end="url(#ah)"/>
  <line class="edge" x1="558" y1="116" x2="598" y2="116" marker-end="url(#ah)"/>

  <!-- day 1 bad write -->
  <text class="accent mono" x="24" y="176" font-size="13">"they all leak" written to notes (first bad write)</text>
  <!-- report note -->
  <text class="ts" x="470" y="176" font-size="13">real cause never made the report</text>

  <!-- backtrack -->
  <line class="back" x1="740" y1="212" x2="70" y2="212" marker-end="url(#ab)"/>
  <text class="accent" x="70" y="204" font-size="13" font-weight="600">stop here</text>
  <text class="ts" x="405" y="246" font-size="13" text-anchor="middle">Backtrack the write chain, from wrong conclusion to cited memory to its write point, stop at the first bad write</text>
</svg>
