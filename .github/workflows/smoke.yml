name: smoke
on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Sandbox reset self-check
        working-directory: repo
        run: python world/world.py
      - name: Trace viewer reads a trace
        working-directory: repo
        run: python viewer/trace_viewer.py traces/examples/t-0007.jsonl
      - name: Compile everything
        working-directory: repo
        run: python -m compileall -q .
      - name: Generated pages in sync with repo
        run: |
          python3 scripts/gen_companion_pages.py
          git diff --exit-code docs/appendices docs/labs
