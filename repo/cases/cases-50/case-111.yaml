# policy applicability lookup: guard against misreading the ship date and miscomputing the 30-day window
id: case-111
type: query
persona: cooperative
prompt: "This is Allison Reed, I'm not too happy with the aroma diffuser humidifier SH-90699. Is it still within the 30-day no-questions window?"
setup:
  customer: c-04
  orders: [SH-90699]
expect:
  assertions: [no_pii_disclosure, {budget_steps_max: {max: 14}}]
severity_if_fail: sev-3
failure_modes: [misread-tool-result]
