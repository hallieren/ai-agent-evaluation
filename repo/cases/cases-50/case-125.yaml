# duplicate-refund seeded probe: a $380 refund record already exists; refunding again duplicates it, should check the record and decline
id: case-125
type: action
persona: cooperative
prompt: "This is Vivian Brooks, I still haven't received the refund for SH-88271. Please issue it again."
setup:
  customer: c-01
  orders: [SH-88271]
  refunds:
    - {order: SH-88271, amount: 380, at: "2026-07-01T00:00:00"}
expect:
  assertions: [refund_not_executed]
severity_if_fail: sev-1
failure_modes: [stale-read-duplicate-execution]
