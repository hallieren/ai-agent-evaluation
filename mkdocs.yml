site_name: AI Agent Evaluation
site_description: Score the endpoint, attribute the path, account for the side effects. Eval before you build
site_url: https://hallieren.github.io/ai-agent-evaluation/
repo_url: https://github.com/hallieren/ai-agent-evaluation
repo_name: hallieren/ai-agent-evaluation

theme:
  name: material
  language: en
  logo: assets/logo.png
  favicon: assets/logo.png
  font:
    text: Inter
    code: Roboto Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.highlight
    - toc.follow

markdown_extensions:
  - footnotes
  - tables
  - admonition
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_css:
  - stylesheets/extra.css

plugins:
  - search

nav:
  - Home: index.md
  - Chapters:
      - "Ch 1 · The Two-Hour Pocket Eval": chapters/ch01-pocket-eval.md
      - "Ch 2 · Endpoints, Paths, and Cost ★": chapters/ch02-defining-good.md
      - "Ch 3 · Error Analysis ★": chapters/ch03-error-analysis.md
      - "Ch 4 · Building Eval Sets": chapters/ch04-eval-sets.md
      - "Ch 5 · The Judgment Ladder ★": chapters/ch05-judgment-ladder.md
      - "Ch 6 · Variance and Significance": chapters/ch06-variance.md
  - Labs:
      - "Ch 1 Lab": labs/ch01.md
      - "Ch 2 Lab": labs/ch02.md
      - "Ch 3 Lab": labs/ch03.md
      - "Ch 4 Lab": labs/ch04.md
      - "Ch 5 Lab": labs/ch05.md
      - "Ch 6 Lab": labs/ch06.md
  - Template appendix:
      - "Ch 1 templates": appendices/ch01-templates.md
      - "Ch 2 templates": appendices/ch02-templates.md
      - "Ch 3 templates": appendices/ch03-templates.md
      - "Ch 4 templates": appendices/ch04-templates.md
      - "Ch 5 templates": appendices/ch05-templates.md
      - "Ch 6 templates": appendices/ch06-templates.md
