site_name: AI Agent Evaluation
site_description: Score the endpoint, attribute the path, account for the side effects. Eval before you build
site_url: https://hallieren.github.io/ai-agent-evaluation/
repo_url: https://github.com/hallieren/ai-agent-evaluation
repo_name: hallieren/ai-agent-evaluation

theme:
  name: material
  language: en
  logo: assets/logo.png
  favicon: assets/logo.png
  font:
    text: Inter
    code: Roboto Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.highlight
    - toc.follow

markdown_extensions:
  - footnotes
  - tables
  - admonition
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_css:
  - stylesheets/extra.css

plugins:
  - search

nav:
  - Home: index.md
  - Chapters:
      - "Ch 1 · The Two-Hour Pocket Eval": chapters/ch01-pocket-eval.md
  - Labs:
      - "Ch 1 Lab": labs/ch01.md
  - Template appendix:
      - "Ch 1 templates": appendices/ch01-templates.md
